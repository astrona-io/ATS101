# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats101-030
course_id: ATS101
exam_code: HARBOR
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: Identity Integration With OIDC
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
- id: ats101-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name the authentication modes
  source_readings:
  - sections/section-030/module-01/course-01-authentication-modes.md
  prompt: Which value of `auth_mode` makes an OpenID Connect provider check the passwords?
  options:
  - id: a
    text: "`db_auth`"
    explanation: Not correct. That is the default mode, where Harbor checks its own database.
  - id: b
    text: "`ldap_auth`"
    explanation: Not correct. That mode uses an LDAP server.
  - id: c
    text: "`http_auth`"
    explanation: Not correct. That mode uses a web service in front of Harbor.
  - id: d
    text: "`oidc_auth`"
    explanation: Correct. `oidc_auth` is the OIDC mode.
  correct_option: d
  explanation: Correct. `oidc_auth` is the OIDC mode.

- id: ats101-030-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: State when the mode can change
  source_readings:
  - sections/section-030/module-01/course-01-authentication-modes.md
  prompt: The setting `auth_mode` shows `editable` as `false`. What does it mean?
  options:
  - id: a
    text: The administrator has no permission to change settings.
    explanation: Not correct. It is not a permission problem.
  - id: b
    text: Keycloak is not reachable.
    explanation: Not correct. Reachability does not set this flag.
  - id: c
    text: Local users other than `admin` exist in Harbor's database.
    explanation: Correct. The mode can change only while no local users exist.
  - id: d
    text: The mode is already OIDC.
    explanation: Not correct. The flag does not depend on the current value.
  correct_option: c
  explanation: Correct. The mode can change only while no local users exist.

- id: ats101-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Give Harbor the right provider address
  source_readings:
  - sections/section-030/module-01/course-01-authentication-modes.md
  prompt: What address do you give Harbor as the OIDC provider endpoint?
  options:
  - id: a
    text: The issuer URL, such as `http://keycloak.localtest.me:8180/realms/harbor`.
    explanation: Correct. Harbor adds the discovery path itself.
  - id: b
    text: The URL of the discovery document ending in `/.well-known/openid-configuration`.
    explanation: Not correct. Harbor adds that part itself.
  - id: c
    text: The URL of the Keycloak administration console.
    explanation: Not correct. Harbor needs the issuer of the realm.
  - id: d
    text: The callback URL of Harbor.
    explanation: Not correct. That address belongs in the Keycloak client.
  correct_option: a
  explanation: Correct. Harbor adds the discovery path itself.

- id: ats101-030-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the redirect URI
  source_readings:
  - sections/section-030/module-01/course-02-configuring-oidc.md
  prompt: What is the redirect URI of the Keycloak client for Harbor?
  options:
  - id: a
    text: The address of the Keycloak sign-in page.
    explanation: Not correct. The redirect URI points back to Harbor.
  - id: b
    text: Any address under the Harbor domain.
    explanation: Not correct. Keycloak accepts only registered addresses.
  - id: c
    text: The address Harbor uses to read the discovery document.
    explanation: Not correct. That address is the issuer.
  - id: d
    text: The only address Keycloak sends the browser back to with a code. It must match exactly, including the port.
    explanation: Correct. Harbor builds it from its external URL plus `/c/oidc/callback`.
  correct_option: d
  explanation: Correct. Harbor builds it from its external URL plus `/c/oidc/callback`.

- id: ats101-030-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Set the OIDC scope
  source_readings:
  - sections/section-030/module-01/course-02-configuring-oidc.md
  prompt: Which value must the OIDC scope in Harbor include?
  options:
  - id: a
    text: "`groups`"
    explanation: Not correct. Groups come from a claim and a mapper, not from this required value.
  - id: b
    text: "`openid`"
    explanation: Correct. Without it the provider returns no ID token.
  - id: c
    text: "`offline`"
    explanation: Not correct. It is not required for sign-in.
  - id: d
    text: "`admin`"
    explanation: Not correct. It is not an OIDC scope that Harbor needs.
  correct_option: b
  explanation: Correct. Without it the provider returns no ID token.

- id: ats101-030-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Test the connection before saving
  source_readings:
  - sections/section-030/module-01/course-02-configuring-oidc.md
  prompt: What does the `/api/v2.0/system/oidc/ping` call prove?
  options:
  - id: a
    text: That Harbor's `core` component can reach the provider, not only your browser.
    explanation: Correct. The test runs inside Harbor.
  - id: b
    text: That the client secret is correct.
    explanation: Not correct. The call tests the endpoint.
  - id: c
    text: That a user can sign in.
    explanation: Not correct. It signs nobody in.
  - id: d
    text: That the groups claim is in the token.
    explanation: Not correct. It only fetches the discovery document.
  correct_option: a
  explanation: Correct. The test runs inside Harbor.

- id: ats101-030-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain automatic onboarding
  source_readings:
  - sections/section-030/module-01/course-02-configuring-oidc.md
  prompt: What does automatic onboarding do?
  options:
  - id: a
    text: It creates every user of the provider in Harbor at once.
    explanation: Not correct. It happens at each first sign-in.
  - id: b
    text: It gives new users the Developer role in all projects.
    explanation: Not correct. Onboarding gives no project roles.
  - id: c
    text: It creates the Harbor user at the first sign-in, with the name from the username claim.
    explanation: Correct. The claim must be in the ID token.
  - id: d
    text: It copies the user's password into Harbor.
    explanation: Not correct. Harbor never gets the password.
  correct_option: c
  explanation: Correct. The claim must be in the ID token.

- id: ats101-030-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Add an OIDC group as a project member
  source_readings:
  - sections/section-030/module-01/course-03-oidc-groups-and-cli-secrets.md
  prompt: Which group type does the REST API use for an OIDC group member of a project?
  options:
  - id: a
    text: "`3`"
    explanation: Correct. Type `1` is an LDAP group and `3` is an OIDC group.
  - id: b
    text: "`1`"
    explanation: Not correct. Type `1` is an LDAP group.
  - id: c
    text: "`2`"
    explanation: Not correct. Group type `2` is not the OIDC type.
  - id: d
    text: "`5`"
    explanation: Not correct. `5` is the role number of Limited Guest, not a group type.
  correct_option: a
  explanation: Correct. Type `1` is an LDAP group and `3` is an OIDC group.

- id: ats101-030-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the OIDC admin group
  source_readings:
  - sections/section-030/module-01/course-03-oidc-groups-and-cli-secrets.md
  prompt: What happens to a user whose `groups` claim contains the Harbor admin group?
  options:
  - id: a
    text: The user gets the Project Admin role in every project.
    explanation: Not correct. The user gets system administrator rights.
  - id: b
    text: The user is stored in Harbor's database as an administrator.
    explanation: Not correct. The rights are granted per session.
  - id: c
    text: The user gets system administrator rights for that session. Harbor accepts only one such group.
    explanation: Correct. The rights come from the identity provider.
  - id: d
    text: Nothing, until an administrator confirms it.
    explanation: Not correct. No confirmation is needed.
  correct_option: c
  explanation: Correct. The rights come from the identity provider.

- id: ats101-030-q10
  type: single_choice
  difficulty: beginner
  learning_objective: Sign a registry client in with OIDC
  source_readings:
  - sections/section-030/module-01/course-03-oidc-groups-and-cli-secrets.md
  prompt: "`oras` cannot use a browser. What does an OIDC user send as the password?"
  options:
  - id: a
    text: The Keycloak password.
    explanation: Not correct. Registry clients need the CLI secret.
  - id: b
    text: The CLI secret from the user profile.
    explanation: Correct. A new CLI secret stops the old one from working.
  - id: c
    text: The client secret of the Harbor client.
    explanation: Not correct. That secret belongs to Harbor, not to the user.
  - id: d
    text: The ID token of the last browser sign-in.
    explanation: Not correct. It is not a password that Harbor accepts here.
  correct_option: b
  explanation: Correct. A new CLI secret stops the old one from working.
