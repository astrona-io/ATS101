# Connect Harbor To Keycloak And Map A Group
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-101-lab-030-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4) and the extra services, the CoreDNS rewrites and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-101-lab-030-01-setup"
      description: "Creates the Keycloak realm harbor with the client, groups and users, and the Harbor project inventory; Harbor still uses database authentication"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until the workstation trusts Harbor and Harbor reports every component healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-oidc-settings"
      description: "Confirms Harbor uses OIDC with the Keycloak realm harbor, the groups claim, the admin group and automatic onboarding"
      type: "file"
      source: "validation/validate-oidc-settings.sh"
    - name: "validate-group-membership"
      description: "Confirms the OIDC group inventory-devs is Developer of inventory"
      type: "file"
      source: "validation/validate-group-membership.sh"
    - name: "validate-oidc-sign-in"
      description: "Signs alice in through Keycloak, then pushes with her CLI secret; carol's push is refused"
      type: "file"
      source: "validation/validate-oidc-sign-in.sh"
    - name: "validate-admin-group"
      description: "Signs bob in and confirms the admin group gives him Harbor administrator rights"
      type: "file"
      source: "validation/validate-admin-group.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
      - quay.io/keycloak/keycloak:26.8.1
