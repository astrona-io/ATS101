# Knowledge check for module 020-02. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats101-020-m02
course_id: ATS101
exam_code: HARBOR
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: module-020-02
  title: "Understand Quota Accounting In Depth"
placement:
  position: after
  reading: sections/section-020/module-02/course-05-summary.md
questions:
- id: ats101-020-m02-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Locate the default quota"
  source_readings:
  - sections/section-020/module-02/course-01-default-quotas.md
  prompt: "Where does Harbor store the default storage quota for new projects?"
  options:
  - id: a
    text: "In each project's metadata as default_quota."
    explanation: "Not correct. The default is a system configuration setting that an administrator changes with PUT /configurations."
  - id: b
    text: "In the system configuration as storage_per_project, in bytes."
    explanation: "Correct. The default is a system configuration setting that an administrator changes with PUT /configurations."
  - id: c
    text: "In the registry component's configuration file only."
    explanation: "Not correct. The default is a system configuration setting that an administrator changes with PUT /configurations."
  - id: d
    text: "In the Helm values, and it cannot change at run time."
    explanation: "Not correct. The default is a system configuration setting that an administrator changes with PUT /configurations."
  correct_option: b
  explanation: "Correct. The default is a system configuration setting that an administrator changes with PUT /configurations."

- id: ats101-020-m02-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain which projects the default affects"
  source_readings:
  - sections/section-020/module-02/course-01-default-quotas.md
  prompt: "An administrator changes the default quota from unlimited to 10 MiB. What happens to the projects that already exist?"
  options:
  - id: a
    text: "They keep their own quota."
    explanation: "Correct. The default is copied into a project only when Harbor creates it."
  - id: b
    text: "They all get 10 MiB."
    explanation: "Not correct. The default is copied into a project only when Harbor creates it."
  - id: c
    text: "They get 10 MiB only if they are empty."
    explanation: "Not correct. The default is copied into a project only when Harbor creates it."
  - id: d
    text: "They get the smaller of their quota and 10 MiB."
    explanation: "Not correct. The default is copied into a project only when Harbor creates it."
  correct_option: a
  explanation: "Correct. The default is copied into a project only when Harbor creates it."

- id: ats101-020-m02-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: "Create a project that inherits the default"
  source_readings:
  - sections/section-020/module-02/course-01-default-quotas.md
  prompt: "Which command creates a project that receives the default quota?"
  options:
  - id: a
    text: "harbor project create team --storage-limit -1"
    explanation: "Not correct. A storage limit passed at creation sets the quota on the project itself, so the default is not used."
  - id: b
    text: "harbor project create team --public"
    explanation: "Not correct. A storage limit passed at creation sets the quota on the project itself, so the default is not used."
  - id: c
    text: "Any command, because the default always overrides the project."
    explanation: "Not correct. A storage limit passed at creation sets the quota on the project itself, so the default is not used."
  - id: d
    text: "A REST API call that leaves storage_limit out."
    explanation: "Correct. A storage limit passed at creation sets the quota on the project itself, so the default is not used."
  correct_option: d
  explanation: "Correct. A storage limit passed at creation sets the quota on the project itself, so the default is not used."

- id: ats101-020-m02-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: "Describe how shared blobs are counted"
  source_readings:
  - sections/section-020/module-02/course-02-how-harbor-counts-storage.md
  prompt: "Two artifacts in one project use the same 3 MiB blob. How much storage does Harbor count for the blob in that project?"
  options:
  - id: a
    text: "6 MiB, once per artifact."
    explanation: "Not correct. Harbor counts a blob once per project, however many artifacts reference it."
  - id: b
    text: "0 MiB, because the second use is free."
    explanation: "Not correct. Harbor counts a blob once per project, however many artifacts reference it."
  - id: c
    text: "3 MiB, once."
    explanation: "Correct. Harbor counts a blob once per project, however many artifacts reference it."
  - id: d
    text: "1.5 MiB, split between the artifacts."
    explanation: "Not correct. Harbor counts a blob once per project, however many artifacts reference it."
  correct_option: c
  explanation: "Correct. Harbor counts a blob once per project, however many artifacts reference it."

- id: ats101-020-m02-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: "Describe cross-project accounting"
  source_readings:
  - sections/section-020/module-02/course-02-how-harbor-counts-storage.md
  prompt: "The same 3 MiB blob is pushed to two different projects. What is counted?"
  options:
  - id: a
    text: "3 MiB in the first project only."
    explanation: "Not correct. Blob sharing is scoped to one project, so each project is charged."
  - id: b
    text: "3 MiB in each project."
    explanation: "Correct. Blob sharing is scoped to one project, so each project is charged."
  - id: c
    text: "3 MiB split between the two projects."
    explanation: "Not correct. Blob sharing is scoped to one project, so each project is charged."
  - id: d
    text: "Nothing, because the registry stores it once."
    explanation: "Not correct. Blob sharing is scoped to one project, so each project is charged."
  correct_option: b
  explanation: "Correct. Blob sharing is scoped to one project, so each project is charged."

- id: ats101-020-m02-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain the cost of a copy"
  source_readings:
  - sections/section-020/module-02/course-02-how-harbor-counts-storage.md
  prompt: "A user copies a large artifact from project A into project B, which has a small quota. Which project may refuse the operation?"
  options:
  - id: a
    text: "Project B, which is charged for the blobs."
    explanation: "Correct. The target project receives the artifact and is charged for it."
  - id: b
    text: "Project A, which loses the blobs."
    explanation: "Not correct. The target project receives the artifact and is charged for it."
  - id: c
    text: "Neither, because a copy is free."
    explanation: "Not correct. The target project receives the artifact and is charged for it."
  - id: d
    text: "Both, because both are charged twice."
    explanation: "Not correct. The target project receives the artifact and is charged for it."
  correct_option: a
  explanation: "Correct. The target project receives the artifact and is charged for it."

- id: ats101-020-m02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Update a quota with the API"
  source_readings:
  - sections/section-020/module-02/course-03-reading-quota-usage.md
  prompt: "In the REST API, which value goes into PUT /quotas/{id}?"
  options:
  - id: a
    text: "The numeric ID of the project."
    explanation: "Not correct. The quota has its own ID, which the /quotas list returns next to the reference."
  - id: b
    text: "The name of the project."
    explanation: "Not correct. The quota has its own ID, which the /quotas list returns next to the reference."
  - id: c
    text: "The ID of the member who sets it."
    explanation: "Not correct. The quota has its own ID, which the /quotas list returns next to the reference."
  - id: d
    text: "The ID of the quota object, not the project ID."
    explanation: "Correct. The quota has its own ID, which the /quotas list returns next to the reference."
  correct_option: d
  explanation: "Correct. The quota has its own ID, which the /quotas list returns next to the reference."

- id: ats101-020-m02-q08
  type: single_choice
  difficulty: beginner
  learning_objective: "Read quota values"
  source_readings:
  - sections/section-020/module-02/course-03-reading-quota-usage.md
  prompt: "What does a hard storage value of -1 mean in the /quotas output?"
  options:
  - id: a
    text: "A limit of one byte."
    explanation: "Not correct. -1 means unlimited."
  - id: b
    text: "The quota is disabled for deletes."
    explanation: "Not correct. -1 means unlimited."
  - id: c
    text: "No limit."
    explanation: "Correct. -1 means unlimited."
  - id: d
    text: "The project is read-only."
    explanation: "Not correct. -1 means unlimited."
  correct_option: c
  explanation: "Correct. -1 means unlimited."

- id: ats101-020-m02-q09
  type: single_choice
  difficulty: beginner
  learning_objective: "Know who sets a quota"
  source_readings:
  - sections/section-020/module-02/course-03-reading-quota-usage.md
  prompt: "Who can change the storage quota of a project?"
  options:
  - id: a
    text: "Any Project Admin of the project."
    explanation: "Not correct. A Project Admin can see the quota but only a system administrator can set it."
  - id: b
    text: "Only a system administrator."
    explanation: "Correct. A Project Admin can see the quota but only a system administrator can set it."
  - id: c
    text: "Any Maintainer of the project."
    explanation: "Not correct. A Project Admin can see the quota but only a system administrator can set it."
  - id: d
    text: "Any member who pushes to the project."
    explanation: "Not correct. A Project Admin can see the quota but only a system administrator can set it."
  correct_option: b
  explanation: "Correct. A Project Admin can see the quota but only a system administrator can set it."

- id: ats101-020-m02-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain garbage collection and quotas"
  source_readings:
  - sections/section-020/module-02/course-04-quotas-and-deletion.md
  prompt: "What does garbage collection do in relation to a quota?"
  options:
  - id: a
    text: "It removes unreferenced blobs from storage; the quota never deletes anything."
    explanation: "Correct. The quota only refuses pushes. Garbage collection frees disk space for blobs that no artifact references."
  - id: b
    text: "It raises the quota of a full project."
    explanation: "Not correct. The quota only refuses pushes. Garbage collection frees disk space for blobs that no artifact references."
  - id: c
    text: "It deletes the oldest artifacts of a full project."
    explanation: "Not correct. The quota only refuses pushes. Garbage collection frees disk space for blobs that no artifact references."
  - id: d
    text: "It resets the used value to zero."
    explanation: "Not correct. The quota only refuses pushes. Garbage collection frees disk space for blobs that no artifact references."
  correct_option: a
  explanation: "Correct. The quota only refuses pushes. Garbage collection frees disk space for blobs that no artifact references."

