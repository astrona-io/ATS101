# Combine Two Retention Rules With Immutability Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-101-lab-020-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4), the CoreDNS rewrites and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-101-lab-020-03-setup"
      description: "Creates the project catalog with web (build-1 to build-5, release-1.0) and api (build-1 to build-4)"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until the workstation trusts Harbor and Harbor reports every component healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-rules-present"
      description: "Confirms the retention policy has two enabled rules, no schedule, and release-* is immutable"
      type: "file"
      source: "validation/validate-rules-present.sh"
    - name: "validate-immutable-release"
      description: "Confirms catalog/web:release-1.0 cannot be overwritten"
      type: "file"
      source: "validation/validate-immutable-release.sh"
    - name: "validate-retention-result"
      description: "Runs the retention policy and expects web to keep build-4, build-5 and release-1.0, and api to keep all four builds"
      type: "file"
      source: "validation/validate-retention-result.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine

