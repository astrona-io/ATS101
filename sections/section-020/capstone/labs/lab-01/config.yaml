# Stop Retention From Deleting Releases
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-101-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4), the CoreDNS rewrites and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-101-capstone-020-setup"
      description: "Creates inventory with builds and two releases, a 5 MiB quota and a retention policy that keeps only one artifact"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until the workstation trusts Harbor and Harbor reports every component healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-quota-raised"
      description: "Confirms the quota is 50 MiB and a 10 MiB artifact can be pushed"
      type: "file"
      source: "validation/validate-quota-raised.sh"
    - name: "validate-releases-protected"
      description: "Confirms release-* tags are immutable"
      type: "file"
      source: "validation/validate-releases-protected.sh"
    - name: "validate-no-schedule"
      description: "Confirms the retention policy has no schedule"
      type: "file"
      source: "validation/validate-no-schedule.sh"
    - name: "validate-retention-result"
      description: "Runs the retention policy and expects the three newest builds and both releases"
      type: "file"
      source: "validation/validate-retention-result.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
