# Isolate Two Teams With Projects And Roles
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-101-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4), the CoreDNS rewrites and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-101-lab-010-01-setup"
      description: "Creates the local users alice, bob and carol; no projects"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until the workstation trusts Harbor and Harbor reports every component healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-projects-private"
      description: "Confirms team-a and team-b exist and are private"
      type: "file"
      source: "validation/validate-projects-private.sh"
    - name: "validate-member-roles"
      description: "Confirms alice and bob are Developers of their own project and carol is Guest of both"
      type: "file"
      source: "validation/validate-member-roles.sh"
    - name: "validate-team-isolation"
      description: "Pushes and pulls as alice and bob: each reaches only their own project"
      type: "file"
      source: "validation/validate-team-isolation.sh"
    - name: "validate-auditor-read-only"
      description: "Confirms carol can pull from both projects and push to neither"
      type: "file"
      source: "validation/validate-auditor-read-only.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
