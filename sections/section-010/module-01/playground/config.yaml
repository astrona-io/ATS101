# Isolate Teams With Projects And Roles (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-101-playground-010-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm and Harbor 2.15.4, start the workstation, and create the users alice, bob and carol and the private project inventory."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod with the Harbor client tools (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
