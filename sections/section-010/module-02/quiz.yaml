# Knowledge check for module 010-02. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats101-010-m02
course_id: ATS101
exam_code: HARBOR
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: module-010-02
  title: "Manage Local Users And System Administrators"
placement:
  position: after
  reading: sections/section-010/module-02/course-05-summary.md
questions:
- id: ats101-010-m02-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Name the authentication modes"
  source_readings:
  - sections/section-010/module-02/course-01-local-users.md
  prompt: "Which authentication mode stores users in Harbor's own database?"
  options:
  - id: a
    text: "ldap_auth"
    explanation: "Not correct. db_auth is the default mode with local users."
  - id: b
    text: "db_auth"
    explanation: "Correct. db_auth is the default mode with local users."
  - id: c
    text: "oidc_auth"
    explanation: "Not correct. db_auth is the default mode with local users."
  - id: d
    text: "local_auth"
    explanation: "Not correct. db_auth is the default mode with local users."
  correct_option: b
  explanation: "Correct. db_auth is the default mode with local users."

- id: ats101-010-m02-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: "Use user endpoints"
  source_readings:
  - sections/section-010/module-02/course-01-local-users.md
  prompt: "Which value do most Harbor user endpoints take to identify a user?"
  options:
  - id: a
    text: "The numeric user_id."
    explanation: "Correct. Search by name first and use the user_id in the path."
  - id: b
    text: "The username."
    explanation: "Not correct. Search by name first and use the user_id in the path."
  - id: c
    text: "The email address."
    explanation: "Not correct. Search by name first and use the user_id in the path."
  - id: d
    text: "The realname."
    explanation: "Not correct. Search by name first and use the user_id in the path."
  correct_option: a
  explanation: "Correct. Search by name first and use the user_id in the path."

- id: ats101-010-m02-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know unique fields"
  source_readings:
  - sections/section-010/module-02/course-01-local-users.md
  prompt: "What does Harbor return when you create a user whose email already belongs to another user?"
  options:
  - id: a
    text: "HTTP 201 and a second account."
    explanation: "Not correct. Username and email must be unique."
  - id: b
    text: "HTTP 404."
    explanation: "Not correct. Username and email must be unique."
  - id: c
    text: "HTTP 200 and the old account is replaced."
    explanation: "Not correct. Username and email must be unique."
  - id: d
    text: "HTTP 409."
    explanation: "Correct. Username and email must be unique."
  correct_option: d
  explanation: "Correct. Username and email must be unique."

- id: ats101-010-m02-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: "Compare the flag with a role"
  source_readings:
  - sections/section-010/module-02/course-02-system-administrators.md
  prompt: "What can a system administrator do that a Project Admin cannot?"
  options:
  - id: a
    text: "Add members to the project."
    explanation: "Not correct. Quotas and the system configuration need the administrator flag."
  - id: b
    text: "Create retention rules in the project."
    explanation: "Not correct. Quotas and the system configuration need the administrator flag."
  - id: c
    text: "Set a project's quota."
    explanation: "Correct. Quotas and the system configuration need the administrator flag."
  - id: d
    text: "Push to the project."
    explanation: "Not correct. Quotas and the system configuration need the administrator flag."
  correct_option: c
  explanation: "Correct. Quotas and the system configuration need the administrator flag."

- id: ats101-010-m02-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: "Grant the flag"
  source_readings:
  - sections/section-010/module-02/course-02-system-administrators.md
  prompt: "Which request grants the administrator flag to a user?"
  options:
  - id: a
    text: "POST /projects/{name}/members with role 1."
    explanation: "Not correct. The flag has its own endpoint."
  - id: b
    text: "PUT /users/{user_id}/sysadmin with sysadmin_flag set to true."
    explanation: "Correct. The flag has its own endpoint."
  - id: c
    text: "PUT /configurations with admin set to the username."
    explanation: "Not correct. The flag has its own endpoint."
  - id: d
    text: "PATCH /users/{user_id} with role=admin."
    explanation: "Not correct. The flag has its own endpoint."
  correct_option: b
  explanation: "Correct. The flag has its own endpoint."

- id: ats101-010-m02-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: "Restrict project creation"
  source_readings:
  - sections/section-010/module-02/course-03-system-settings.md
  prompt: "What does project_creation_restriction set to adminonly do?"
  options:
  - id: a
    text: "Normal users receive HTTP 403 when they create a new project."
    explanation: "Correct. It only restricts new projects."
  - id: b
    text: "It deletes projects that normal users created."
    explanation: "Not correct. It only restricts new projects."
  - id: c
    text: "It removes the Project Admin role of the creators."
    explanation: "Not correct. It only restricts new projects."
  - id: d
    text: "It makes every project private."
    explanation: "Not correct. It only restricts new projects."
  correct_option: a
  explanation: "Correct. It only restricts new projects."

- id: ats101-010-m02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know when the mode is locked"
  source_readings:
  - sections/section-010/module-02/course-03-system-settings.md
  prompt: "When is the authentication mode still editable?"
  options:
  - id: a
    text: "Always."
    explanation: "Not correct. The editable field of auth_mode becomes false once local users exist."
  - id: b
    text: "Only after a restart of Harbor."
    explanation: "Not correct. The editable field of auth_mode becomes false once local users exist."
  - id: c
    text: "Only while self_registration is true."
    explanation: "Not correct. The editable field of auth_mode becomes false once local users exist."
  - id: d
    text: "While no user other than admin exists."
    explanation: "Correct. The editable field of auth_mode becomes false once local users exist."
  correct_option: d
  explanation: "Correct. The editable field of auth_mode becomes false once local users exist."

- id: ats101-010-m02-q08
  type: single_choice
  difficulty: beginner
  learning_objective: "Assess self-registration"
  source_readings:
  - sections/section-010/module-02/course-03-system-settings.md
  prompt: "What is the main risk of self_registration set to true on an internal registry?"
  options:
  - id: a
    text: "Harbor deletes unused accounts."
    explanation: "Not correct. Open sign-up lets strangers create accounts."
  - id: b
    text: "All projects become public."
    explanation: "Not correct. Open sign-up lets strangers create accounts."
  - id: c
    text: "Anyone who can reach Harbor can create an account."
    explanation: "Correct. Open sign-up lets strangers create accounts."
  - id: d
    text: "Quotas stop working."
    explanation: "Not correct. Open sign-up lets strangers create accounts."
  correct_option: c
  explanation: "Correct. Open sign-up lets strangers create accounts."

- id: ats101-010-m02-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know what offboarding keeps"
  source_readings:
  - sections/section-010/module-02/course-04-offboarding-users.md
  prompt: "What happens to the artifacts a user pushed when the user is deleted?"
  options:
  - id: a
    text: "They are deleted with the user."
    explanation: "Not correct. Artifacts belong to projects."
  - id: b
    text: "They stay in their projects."
    explanation: "Correct. Artifacts belong to projects."
  - id: c
    text: "They move to the library project."
    explanation: "Not correct. Artifacts belong to projects."
  - id: d
    text: "They become private to admin."
    explanation: "Not correct. Artifacts belong to projects."
  correct_option: b
  explanation: "Correct. Artifacts belong to projects."

- id: ats101-010-m02-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: "Plan an offboarding"
  source_readings:
  - sections/section-010/module-02/course-04-offboarding-users.md
  prompt: "Why should CI credentials move to a robot account before a user is deleted?"
  options:
  - id: a
    text: "A pipeline that uses the user's password fails after the delete."
    explanation: "Correct. The deleted user can no longer sign in."
  - id: b
    text: "Robot accounts are faster."
    explanation: "Not correct. The deleted user can no longer sign in."
  - id: c
    text: "Harbor cannot delete users with robot accounts."
    explanation: "Not correct. The deleted user can no longer sign in."
  - id: d
    text: "The delete removes the project."
    explanation: "Not correct. The deleted user can no longer sign in."
  correct_option: a
  explanation: "Correct. The deleted user can no longer sign in."

