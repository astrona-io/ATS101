# Restrict Project Creation And Delegate Administration Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-101-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4), the CoreDNS rewrites and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-101-lab-010-02-setup"
      description: "Creates the users alice, bob and temp-user, with project creation open to everyone"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until the workstation trusts Harbor and Harbor reports every component healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-alice-sysadmin"
      description: "Confirms alice is a system administrator and bob is not"
      type: "file"
      source: "validation/validate-alice-sysadmin.sh"
    - name: "validate-creation-restricted"
      description: "Confirms only administrators can create projects: bob gets 403 and alice succeeds"
      type: "file"
      source: "validation/validate-creation-restricted.sh"
    - name: "validate-temp-user-deleted"
      description: "Confirms the user temp-user no longer exists"
      type: "file"
      source: "validation/validate-temp-user-deleted.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine

