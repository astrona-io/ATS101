  difficulty: intermediate
  learning_objective: "Know when group changes arrive"
  source_readings:
  - sections/section-030/module-02/course-02-group-role-design.md
  prompt: "carol is moved to another group in Keycloak while she is signed in to Harbor. When does Harbor notice?"
  options:
  - id: a
    text: "At once, because Harbor asks the provider on every request."
    explanation: "Not correct. Harbor reads the groups from the token at each sign-in and does not ask again during the session."
  - id: b
    text: "After one hour, when Harbor polls the provider."
    explanation: "Not correct. Harbor reads the groups from the token at each sign-in and does not ask again during the session."
  - id: c
    text: "At her next sign-in through the browser."
    explanation: "Correct. Harbor reads the groups from the token at each sign-in and does not ask again during the session."
  - id: d
    text: "Never, until the group is edited in Harbor."
