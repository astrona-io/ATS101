- id: ats101-final-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe cross-project accounting
  source_readings:
  - sections/section-020/module-02/course-02-how-harbor-counts-storage.md
  prompt: The same 3 MiB blob is pushed to two different projects. What is counted?
  options:
  - id: a
    text: 3 MiB in the first project only.
    explanation: Not correct. Blob sharing is scoped to one project, so each project
      is charged.
  - id: b
    text: 3 MiB in each project.
    explanation: Correct. Blob sharing is scoped to one project, so each project is
      charged.
  - id: c
    text: 3 MiB split between the two projects.
    explanation: Not correct. Blob sharing is scoped to one project, so each project
      is charged.
  - id: d
    text: Nothing, because the registry stores it once.
    explanation: Not correct. Blob sharing is scoped to one project, so each project
      is charged.
  correct_option: b
  explanation: Correct. Blob sharing is scoped to one project, so each project is
    charged.
