# Final domain quiz. Three questions per section. Listed in astrona.yaml as the last `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats101-final
course_id: ATS101
exam_code: HARBOR
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: ats101
  title: 'Harbor: Project Management, RBAC & Multi-Tenancy'
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
- id: ats101-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what a public project allows
  source_readings:
  - sections/section-010/module-01/course-01-projects-public-and-private.md
  prompt: Who can pull artifacts from a public Harbor project?
  options:
  - id: a
    text: Anyone who can reach Harbor, even a client that does not sign in.
    explanation: Correct. Public only controls reading.
  - id: b
    text: Only members of the project.
    explanation: Not correct. That describes a private project.
  - id: c
    text: Only users with the Developer role or higher.
    explanation: Not correct. Pulling in a public project needs no role.
  - id: d
    text: Only system administrators.
    explanation: Not correct. Administrators can pull, but so can everyone else.
  correct_option: a
  explanation: Correct. Public only controls reading.
- id: ats101-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Tell the five roles apart
  source_readings:
  - sections/section-010/module-01/course-02-member-roles.md
  prompt: Which is the lowest role that may delete artifacts and start scans?
  options:
  - id: a
    text: Guest.
    explanation: Not correct. Guest can only pull.
  - id: b
    text: Maintainer.
    explanation: Correct. Maintainer adds deleting and scanning to Developer.
  - id: c
    text: Developer.
    explanation: Not correct. Developer can push but not delete.
  - id: d
    text: Limited Guest.
    explanation: Not correct. Limited Guest can only pull.
  correct_option: b
  explanation: Correct. Maintainer adds deleting and scanning to Developer.
- id: ats101-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Prove access with a real test
  source_readings:
  - sections/section-010/module-01/course-03-adding-members-with-the-cli.md
  prompt: How do you prove what a user is allowed to do in a project?
  options:
  - id: a
    text: Read the member list of the project.
    explanation: Not correct. The list shows the configuration only.
  - id: b
    text: Check that the user can sign in to Harbor.
    explanation: Not correct. Sign-in works for any valid user, member or not.
  - id: c
    text: Push and pull as that user and check which calls succeed and which are refused.
    explanation: Correct. The member list shows configuration, not what it allows.
  - id: d
    text: Check that the project is private.
    explanation: Not correct. Visibility says nothing about one user's role.
  correct_option: c
  explanation: Correct. The member list shows configuration, not what it allows.
- id: ats101-final-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Explain who sets a quota
  source_readings:
  - sections/section-020/module-01/course-01-storage-quotas.md
  prompt: Who can set or change the storage quota of a project?
  options:
  - id: a
    text: Any Project Admin of that project.
    explanation: Not correct. This would let a team raise its own limit.
  - id: b
    text: Any Maintainer.
    explanation: Not correct. Maintainers have fewer rights than Project Admins.
  - id: c
    text: Any member who pushes into the project.
    explanation: Not correct. Pushing does not give rights over quotas.
  - id: d
    text: A system administrator.
    explanation: Correct. A Project Admin cannot change it.
  correct_option: d
  explanation: Correct. A Project Admin cannot change it.
- id: ats101-final-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Read a retention rule
  source_readings:
  - sections/section-020/module-01/course-02-tag-retention.md
  prompt: What does a tag retention rule describe?
  options:
  - id: a
    text: Which artifacts to keep. Artifacts that no rule keeps are deleted.
    explanation: Correct. Rules are written as what to keep.
  - id: b
    text: Which artifacts to delete.
    explanation: Not correct. Rules never name what to delete.
  - id: c
    text: Which artifacts to scan.
    explanation: Not correct. Scanning is a separate feature.
  - id: d
    text: Which artifacts to copy to another project.
    explanation: Not correct. Retention does not copy anything.
  correct_option: a
  explanation: Correct. Rules are written as what to keep.
- id: ats101-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the role that creates immutability rules
  source_readings:
  - sections/section-020/module-01/course-03-tag-immutability.md
  prompt: Which roles may create tag immutability rules?
  options:
  - id: a
    text: Developer and above.
    explanation: Not correct. A Developer cannot create the rule.
  - id: b
    text: Maintainer and Project Admin.
    explanation: Correct. Developers cannot create them.
  - id: c
    text: Guest and above.
    explanation: Not correct. A Guest can only pull.
  - id: d
    text: Only the system administrator.
    explanation: Not correct. Maintainers and Project Admins can create them.
  correct_option: b
  explanation: Correct. Developers cannot create them.
- id: ats101-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Give Harbor the right provider address
  source_readings:
  - sections/section-030/module-01/course-01-authentication-modes.md
  prompt: What address do you give Harbor as the OIDC provider endpoint?
  options:
  - id: a
    text: The URL of the discovery document ending in `/.well-known/openid-configuration`.
    explanation: Not correct. Harbor adds that part itself.
  - id: b
    text: The URL of the Keycloak administration console.
    explanation: Not correct. Harbor needs the issuer of the realm.
  - id: c
    text: The issuer URL, such as `http://keycloak.localtest.me:8180/realms/harbor`.
    explanation: Correct. Harbor adds the discovery path itself.
  - id: d
    text: The callback URL of Harbor.
    explanation: Not correct. That address belongs in the Keycloak client.
  correct_option: c
  explanation: Correct. Harbor adds the discovery path itself.
- id: ats101-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain automatic onboarding
  source_readings:
  - sections/section-030/module-01/course-02-configuring-oidc.md
  prompt: What does automatic onboarding do?
  options:
  - id: a
    text: It creates every user of the provider in Harbor at once.
    explanation: Not correct. It happens at each first sign-in.
  - id: b
    text: It gives new users the Developer role in all projects.
    explanation: Not correct. Onboarding gives no project roles.
  - id: c
    text: It copies the user's password into Harbor.
    explanation: Not correct. Harbor never gets the password.
  - id: d
    text: It creates the Harbor user at the first sign-in, with the name from the username claim.
    explanation: Correct. The claim must be in the ID token.
  correct_option: d
  explanation: Correct. The claim must be in the ID token.
- id: ats101-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Add an OIDC group as a project member
  source_readings:
  - sections/section-030/module-01/course-03-oidc-groups-and-cli-secrets.md
  prompt: Which group type does the REST API use for an OIDC group member of a project?
  options:
  - id: a
    text: "`3`"
    explanation: Correct. Type `1` is an LDAP group and `3` is an OIDC group.
  - id: b
    text: "`1`"
    explanation: Not correct. Type `1` is an LDAP group.
  - id: c
    text: "`2`"
    explanation: Not correct. Group type `2` is not the OIDC type.
  - id: d
    text: "`5`"
    explanation: Not correct. `5` is the role number of Limited Guest, not a group type.
  correct_option: a
  explanation: Correct. Type `1` is an LDAP group and `3` is an OIDC group.
- id: ats101-final-q10
  type: single_choice
  difficulty: beginner
  learning_objective: Set the base DN
  source_readings:
  - sections/section-040/module-01/course-01-ldap-settings.md
  prompt: What is the base DN?
  options:
  - id: a
    text: The DN of the account that Harbor binds with.
    explanation: Not correct. That is the search DN.
  - id: b
    text: The place in the directory where Harbor starts searching for users.
    explanation: Correct. Users outside it cannot sign in.
  - id: c
    text: The DN of the Harbor administrators group.
    explanation: Not correct. That is the group admin DN.
  - id: d
    text: The URL of the directory server.
    explanation: Not correct. That is the LDAP URL.
  correct_option: b
  explanation: Correct. Users outside it cannot sign in.
- id: ats101-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Pick the group filter for OpenLDAP
  source_readings:
  - sections/section-040/module-01/course-02-ldap-users-and-groups.md
  prompt: In the OpenLDAP image of this course, which group class makes the directory fill each user's `memberOf`?
  options:
  - id: a
    text: "`groupOfNames`, with members in `member`."
    explanation: Not correct. In this image it leaves `memberOf` empty, so Harbor sees no groups.
  - id: b
    text: "`group`, as in Active Directory."
    explanation: Not correct. That is the Active Directory class.
  - id: c
    text: "`groupOfUniqueNames`, with members in `uniqueMember`."
    explanation: Correct. A `groupOfNames` group leaves `memberOf` empty here.
  - id: d
    text: "`inetOrgPerson`."
    explanation: Not correct. That is the class of user entries.
  correct_option: c
  explanation: Correct. A `groupOfNames` group leaves `memberOf` empty here.
- id: ats101-final-q12
  type: single_choice
  difficulty: beginner
  learning_objective: Sign a registry client in with LDAP
  source_readings:
  - sections/section-040/module-01/course-02-ldap-users-and-groups.md
  prompt: What does an LDAP user send to `oras` as the password?
  options:
  - id: a
    text: A CLI secret from the user profile.
    explanation: Not correct. That is for OIDC users.
  - id: b
    text: The search password of Harbor.
    explanation: Not correct. That belongs to the search account.
  - id: c
    text: The `admin` password of Harbor.
    explanation: Not correct. It is a different account.
  - id: d
    text: The password of the directory.
    explanation: Correct. LDAP users need no CLI secret.
  correct_option: d
  explanation: Correct. LDAP users need no CLI secret.
