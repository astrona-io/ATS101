# Narrow The LDAP Filter And Give Two Groups Different Roles Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-101-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4) and the extra services, the CoreDNS rewrites and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-101-lab-040-02-setup"
      description: "Starts OpenLDAP with five users and three groups, creates the project inventory with one artifact, and switches Harbor to LDAP sign-in with a filter that allows every inetOrgPerson"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until the workstation trusts Harbor and Harbor reports every component healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-ldap-filter"
      description: "Confirms the contractor hank cannot sign in, dave, erin and frank still can, and Harbor can bind to the directory"
      type: "file"
      source: "validation/validate-ldap-filter.sh"
    - name: "validate-group-roles"
      description: "Confirms inventory-devs is Developer and inventory-readers is Guest in the project inventory, with their directory DNs"
      type: "file"
      source: "validation/validate-group-roles.sh"
    - name: "validate-role-effect"
      description: "Pushes as dave and gina: dave can push, gina can pull and cannot push"
      type: "file"
      source: "validation/validate-role-effect.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
      - osixia/openldap:1.5.0
