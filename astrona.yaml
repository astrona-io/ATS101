            url: https://goharbor.io/docs/2.15.0/working-with-projects/create-projects/add-users/

  - id: module-020
    title: "Quotas, Tag Retention And Immutability"
    description: >
      Storage quotas and how Harbor counts storage, tag retention rules that
      decide which artifacts stay, dry runs, and tag immutability rules that
      protect releases from being overwritten or deleted.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-020/README.md

      - type: reading
        title: "Control Storage With Quotas, Retention And Immutability"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "Storage Quotas"
        path: sections/section-020/module-01/course-01-storage-quotas.md
      - type: reading
        title: "Tag Retention Rules"
        path: sections/section-020/module-01/course-02-tag-retention.md
      - type: reading
        title: "Tag Immutability Rules"
        path: sections/section-020/module-01/course-03-tag-immutability.md
      - type: reading
        title: Question
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "Keep A Project Within Its Storage Budget Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: storage
        task_kind: build
        tags: [quota, tag-retention, tag-immutability, dry-run, harbor-api, oras]
        learning_goals:
          - Set a storage quota and prove a push over the quota is refused
          - Make release tags immutable and keep only the three newest builds with a retention rule
          - Prove the result with a retention run that leaves the expected tags
        resources:
          - name: "Configure project quotas"
            url: https://goharbor.io/docs/2.15.0/administration/configure-project-quotas/
          - name: "Create tag retention rules"
            url: https://goharbor.io/docs/2.15.0/working-with-projects/working-with-images/create-tag-retention-rules/
          - name: "Create tag immutability rules"
            url: https://goharbor.io/docs/2.15.0/working-with-projects/working-with-images/create-tag-immutability-rules/
      - type: reading
        title: Summary
        path: sections/section-020/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-020/capstone/labs/lab-01/question.md
      - type: lab
        title: "Stop Retention From Deleting Releases Capstone"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: storage
        task_kind: troubleshooting
        tags: [quota, tag-retention, tag-immutability, dry-run, harbor-api]
        learning_goals:
          - Find why a scheduled retention policy would delete every release and why pushes fail
          - Correct the retention rule and its schedule, protect releases and size the quota
          - Prove the result with a retention run and a push that fits the new quota
        resources:
          - name: "Create tag retention rules"
            url: https://goharbor.io/docs/2.15.0/working-with-projects/working-with-images/create-tag-retention-rules/
          - name: "Create tag immutability rules"
            url: https://goharbor.io/docs/2.15.0/working-with-projects/working-with-images/create-tag-immutability-rules/
          - name: "Configure project quotas"
            url: https://goharbor.io/docs/2.15.0/administration/configure-project-quotas/

