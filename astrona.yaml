# Course manifest for ATS101 - Project Management, RBAC & Multi-Tenancy (Harbor).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS101
  title: "Harbor: Project Management, RBAC & Multi-Tenancy"
  maturity: draft
  description: >
    Training material covering the Project Management, RBAC & Multi-Tenancy
    domain of the Harbor training path: public and private projects, member
    roles from Limited Guest to Project Admin, storage quotas, tag retention
    and tag immutability rules, and signing users in through OpenID Connect
    with Keycloak and through LDAP, with groups as project members. Each
    module pairs a layered reader with an ungraded hands-on playground and a
    graded practice lab. Each section closes with an integration capstone.
    Written for Harbor v2.15.4 and the Harbor CLI v0.0.27.

  certification:
    name: Harbor
    code: HARBOR
    provider: Astrona
    domain: Project Management, RBAC & Multi-Tenancy
    weight: 20

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Projects And Membership"
    description: >
      Public and private projects, the five member roles and what each one
      may do, and creating projects and adding members with the harbor CLI
      and the REST API.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Isolate Teams With Projects And Roles"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Projects, Public And Private"
        path: sections/section-010/module-01/course-01-projects-public-and-private.md
      - type: reading
        title: "Member Roles And What Each One May Do"
        path: sections/section-010/module-01/course-02-member-roles.md
      - type: reading
        title: "Adding Members With The harbor CLI"
        path: sections/section-010/module-01/course-03-adding-members-with-the-cli.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Isolate Two Teams With Projects And Roles Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: projects
        task_kind: build
        tags: [project, private-project, project-member, role-developer, role-guest, harbor-cli]
        learning_goals:
          - Create private projects for two teams with the harbor CLI
          - Give each user the smallest role that lets them do their work
          - Prove the isolation by pushing and pulling as each user
        resources:
          - name: "Create projects"
            url: https://goharbor.io/docs/2.15.0/working-with-projects/create-projects/
          - name: "Assign users to a project"
