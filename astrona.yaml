      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair Project Access For Three Teams Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: access-control
        task_kind: troubleshooting
        tags: [private-project, project-member, role-project-admin, role-maintainer, role-guest, harbor-api]
        learning_goals:
          - Find which project settings and memberships give users more access than they need
          - Make a public project private and correct three member roles without recreating the projects
          - Prove each user's access with real pushes, pulls and deletes
        resources:
          - name: "User permissions by role"
            url: https://goharbor.io/docs/2.15.0/administration/managing-users/user-permissions-by-role/
